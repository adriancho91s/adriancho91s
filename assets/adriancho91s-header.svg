<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Adrian Gaitan — AI Software Engineer</title>
  <desc id="description">Dark indigo banner with an abstract network motif, introducing Adrian Gaitan as an AI Software Engineer focused on agentic development, product engineering, and infrastructure at scale.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b16"/>
      <stop offset="55%" stop-color="#11182a"/>
      <stop offset="100%" stop-color="#1a1531"/>
    </linearGradient>
    <radialGradient id="glow" cx="84%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#6655d8" stop-opacity=".36"/>
      <stop offset="100%" stop-color="#6655d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8d7cff"/>
      <stop offset="100%" stop-color="#47c8e8"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#9ebcff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <rect width="1200" height="300" rx="24" fill="url(#glow)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <g fill="none" stroke="#80a7fa" stroke-opacity=".34" stroke-width="2">
    <path d="M800 80 885 125 965 78 1048 130 1135 82"/>
    <path d="M770 185 852 143 930 198 1015 151 1095 206 1170 164"/>
    <path d="M885 125 852 143M965 78 930 198M1048 130 1015 151M1135 82 1095 206"/>
  </g>
  <g fill="#9c8dff" stroke="#d8d2ff" stroke-width="2">
    <circle cx="800" cy="80" r="6"/><circle cx="885" cy="125" r="8"/>
    <circle cx="965" cy="78" r="6"/><circle cx="1048" cy="130" r="8"/>
    <circle cx="1135" cy="82" r="6"/><circle cx="770" cy="185" r="6"/>
    <circle cx="852" cy="143" r="6"/><circle cx="930" cy="198" r="8"/>
    <circle cx="1015" cy="151" r="6"/><circle cx="1095" cy="206" r="8"/>
    <circle cx="1170" cy="164" r="6"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="72" y="126" fill="#f3f5ff" font-size="58" font-weight="700" letter-spacing="-1.4">Adrian Gaitan</text>
    <text x="75" y="174" fill="#c8cbea" font-size="22" font-weight="500" letter-spacing="2.2">AI SOFTWARE ENGINEER · AGENTIC DEVELOPMENT</text>
    <rect x="75" y="213" width="148" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="238" y="220" fill="#94a3c7" font-size="15" letter-spacing="1.4">MULTI-AGENT ORCHESTRATION · PRODUCT ENGINEERING · INFRASTRUCTURE AT SCALE</text>
  </g>
</svg>
